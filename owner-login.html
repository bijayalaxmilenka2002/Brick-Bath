<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick & Bath | Luxury Owner Portal Sign In</title>
  <link rel="icon" type="image/png" href="assets/navlogo.3c15008711dbb09cbf59.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B111A;
      background-image: radial-gradient(circle at 50% 25%, rgba(197, 157, 66, 0.18), transparent 75%),
                        radial-gradient(circle at 80% 80%, rgba(15, 23, 42, 0.8), transparent 60%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #FFFFFF;
    }
    .login-card {
      background: #141C2B;
      border: 1px solid rgba(197, 157, 66, 0.35);
      border-radius: 20px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(197, 157, 66, 0.1);
      position: relative;
    }
    .brand-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(197, 157, 66, 0.15);
      border: 1.5px solid #C59D42;
      color: #E7C873;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 0 20px rgba(197, 157, 66, 0.25);
    }
    .badge {
      background: rgba(197, 157, 66, 0.15);
      color: #E7C873;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid rgba(197, 157, 66, 0.35);
      display: inline-block;
    }
    .title {
      font-family: 'Cinzel', serif;
      font-size: 1.65rem;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0.75rem 0 0.35rem;
      letter-spacing: 0.03em;
    }
    .subtitle {
      color: #94A3B8;
      font-size: 0.86rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 1.15rem;
      text-align: left;
    }
    .input-wrap label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #CBD5E1;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .input-inner {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field-icon {
      position: absolute;
      left: 1rem;
      color: #C59D42;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 3rem 0 2.75rem;
      background: #0B111A;
      border: 1.5px solid rgba(197, 157, 66, 0.3);
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: #C59D42;
      box-shadow: 0 0 0 3px rgba(197, 157, 66, 0.22);
    }
    .toggle-pwd {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94A3B8;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      transition: color 0.2s;
    }
    .toggle-pwd:hover {
      color: #E7C873;
    }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #E7C873, #C59D42);
      border: 1px solid #C59D42;
      color: #0B111A;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 1.25rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(197, 157, 66, 0.4);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #F87171;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      text-align: left;
    }
    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      color: #94A3B8;
      font-size: 0.84rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #E7C873;
    }
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .login-card {
        padding: 2rem 1.25rem;
        border-radius: 16px;
      }
      .title {
        font-size: 1.4rem;
      }
      .form-input {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-icon">
      <i class="fas fa-shield-alt"></i>
    </div>
    <span class="badge">Executive Access</span>
    <h1 class="title">BRICK & BATH</h1>
    <p class="subtitle">Enter your owner credentials to access the confidential consultation queries ledger.</p>

    <div id="loginError" class="error-msg"></div>

    <form id="ownerForm" onsubmit="handleLogin(event)">
      <!-- Username Field -->
      <div class="input-wrap">
        <label for="ownerUsername">Username</label>
        <div class="input-inner">
          <i class="fas fa-user field-icon"></i>
          <input 
            type="text" 
            id="ownerUsername" 
            class="form-input" 
            placeholder="Owner Username" 
            required 
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-wrap">
        <label for="ownerPassword">Password</label>
        <div class="input-inner">
          <i class="fas fa-lock field-icon"></i>
          <input 
            type="password" 
            id="ownerPassword" 
            class="form-input" 
            placeholder="Owner Password" 
            required 
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pwd" onclick="togglePassword()" title="Toggle visibility">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">
        <i class="fas fa-unlock-alt"></i>
        <span>Sign In to Owner Portal</span>
      </button>
    </form>

    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Main Website
    </a>
  </div>

  <script>
    // If owner already has an active session, auto-redirect to inquiries portal
    (async function checkExistingAuth() {
      const token = sessionStorage.getItem("bnb_owner_token") || localStorage.getItem("bnb_owner_token");
      if (!token) return;
      try {
        const res = await fetch("/api/auth/verify", {
          headers: { "Authorization": "Bearer " + token }
        });
        if (res.ok) {
          window.location.replace("inquiries.html");
        } else {
          sessionStorage.removeItem("bnb_owner_token");
          localStorage.removeItem("bnb_owner_token");
        }
      } catch (e) {}
    })();

    function togglePassword() {
      const field = document.getElementById("ownerPassword");
      const icon = document.getElementById("toggleIcon");
      if (field.type === "password") {
        field.type = "text";
        icon.className = "fas fa-eye-slash";
      } else {
        field.type = "password";
        icon.className = "fas fa-eye";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById("ownerUsername").value.trim();
      const password = document.getElementById("ownerPassword").value;
      const errorEl = document.getElementById("loginError");
      const btn = document.getElementById("submitBtn");

      if (!username || !password) return;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Verifying credentials...</span>';
      errorEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          sessionStorage.setItem("bnb_owner_token", data.token);
          localStorage.setItem("bnb_owner_token", data.token);
          window.location.replace("inquiries.html");
        } else {
          errorEl.textContent = data.message || "Invalid username or password. Access denied.";
          errorEl.style.display = "block";
          document.getElementById("ownerPassword").focus();
        }
      } catch (err) {
        errorEl.textContent = "Could not connect to authentication backend server.";
        errorEl.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-unlock-alt"></i> <span>Sign In to Owner Portal</span>';
      }
    }
  </script>
</body>
</html>
